<style>
:root{--navy:#0B2341;--ink:#1b2430;--muted:#5a6472;--paper:#faf8f4;--line:#e6e1d8;--accent:#a8581a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}

p{color:var(--muted);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid var(--navy);color:var(--navy)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
a{color:var(--navy)}
a:focus-visible{outline:3px solid #f0b37a;outline-offset:2px}
